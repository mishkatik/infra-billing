name: Docker image

# Builds the multi-arch image (native amd64 + arm64 runners, pushed by digest, then merged into one
# manifest list) and publishes it to GHCR and Docker Hub under the given tags. Called by the release
# and dev workflows so both ship exactly the same build.
#
# Docker Hub needs the DOCKERHUB_TOKEN secret (an access token with read & write scope). The user
# defaults to the GitHub repository owner and the repository to the GitHub one (owner/name); set
# the DOCKERHUB_USERNAME secret or the DOCKERHUB_IMAGE variable when the Docker Hub names differ.

on:
  workflow_call:
    inputs:
      tags:
        description: Tags to publish, space-separated (e.g. "latest 0.48.0")
        required: true
        type: string
      version-suffix:
        description: Appended to the package.json version shown in the build info (e.g. "-dev")
        required: false
        type: string
        default: ''

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_IMAGE || github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          echo "version=$(jq -r .version package.json)${{ inputs.version-suffix }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # One build, pushed by digest to both registries; the merge job tags it per registry.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            GIT_COMMIT=${{ github.sha }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            args=()
            for tag in $TAGS; do args+=(-t "$image:$tag"); done
            for digest in *; do args+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${args[@]}"
          done

      - name: Inspect images
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tag="${TAGS%% *}"
          docker buildx imagetools inspect "$GHCR_IMAGE:$tag"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$tag"
