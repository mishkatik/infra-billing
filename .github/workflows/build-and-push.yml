name: Build&Push Release Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  send-tg-msg:
    name: Send TG message
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@v3.0.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build started.'

  image:
    name: Image
    uses: ./.github/workflows/docker-image.yml
    with:
      tags: latest ${{ github.ref_name }}
    secrets: inherit

  create-release:
    name: Create release
    needs: [image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Docker image:
            - `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}:latest`
            - `docker.io/${{ vars.DOCKERHUB_IMAGE || github.repository }}:${{ github.ref_name }}`
            - `docker.io/${{ vars.DOCKERHUB_IMAGE || github.repository }}:latest`

  send-finish-tg-msg:
    name: Send TG message
    needs: [image, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        uses: proDreams/actions-telegram-notifier@v3.0.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status }}
          notify_fields: 'repository,branch,commit'
          title: 'Build finished.'

  notify-on-error:
    name: Notify on error
    needs: [image]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send error notification
        uses: proDreams/actions-telegram-notifier@v3.0.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build failed.'
